<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Tether / OPA - Preset Library</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "oled-black": "#000000",
            "surface-0": "#1C1C1E",
            "surface-1": "#2C2C2E",
            "accent-blue": "#0A84FF"
          },
          fontFamily: {
            mono: ["JetBrains Mono", "monospace"],
            sans: ["Hanken Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
<style>
    body { background-color: #000000; color: #E0E2ED; font-family: 'Hanken Grotesk', sans-serif; padding-bottom: 80px; }
    .glass-panel {
      background: rgba(28, 28, 30, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-oled-black min-h-screen p-4 flex flex-col gap-5">
<header class="flex items-center justify-between py-2">
<div class="flex items-center gap-3">
<button class="w-8 h-8 rounded-full glass-panel flex items-center justify-center text-white/70 hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-white tracking-tight">Preset Catalog</h1>
</div>
<button class="w-8 h-8 rounded-full glass-panel flex items-center justify-center text-white/70 hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm">search</span>
</button>
</header>
<!-- Category Tabs -->
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar font-mono text-xs pb-1">
<button class="px-4 py-2 rounded-lg bg-accent-blue/20 backdrop-blur-md text-accent-blue font-bold border border-accent-blue/30 shadow-[0_0_10px_rgba(10,132,255,0.2)]">Docker</button>
<button class="px-4 py-2 rounded-lg glass-panel text-white/60 hover:text-white transition-colors">Nginx</button>
<button class="px-4 py-2 rounded-lg glass-panel text-white/60 hover:text-white transition-colors">Kubernetes</button>
<button class="px-4 py-2 rounded-lg glass-panel text-white/60 hover:text-white transition-colors">System</button>
</div>
<main class="flex flex-col gap-4">
<!-- Preset Card 1 -->
<div class="p-4 rounded-xl glass-panel flex flex-col gap-3 relative overflow-hidden shadow-[0_0_15px_rgba(10,132,255,0.05)]">
<div class="absolute -top-12 -right-12 w-24 h-24 bg-accent-blue/20 rounded-full blur-2xl"></div>
<div class="flex items-center justify-between relative z-10">
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-[#32D74B] shadow-[0_0_6px_#32D74B]"></div>
<span class="font-bold text-white text-sm">List All Running Containers</span>
</div>
<button class="px-3 py-1 rounded bg-accent-blue text-white text-xs font-bold flex items-center gap-1 shadow-[0_0_10px_rgba(10,132,255,0.4)]">
<span class="material-symbols-outlined text-[14px]">add</span> Add
        </button>
</div>
<div class="font-mono text-xs text-white/80 bg-black/60 p-3 rounded-lg border border-white/5 overflow-x-auto shadow-inner relative z-10">
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      </div>
</div>
<!-- Preset Card 2 -->
<div class="p-4 rounded-xl glass-panel flex flex-col gap-3 relative overflow-hidden">
<div class="flex items-center justify-between relative z-10">
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-[#FFD60A] shadow-[0_0_6px_#FFD60A]"></div>
<span class="font-bold text-white text-sm">Prune Unused Images</span>
</div>
<button class="px-3 py-1 rounded bg-accent-blue text-white text-xs font-bold flex items-center gap-1 shadow-[0_0_10px_rgba(10,132,255,0.4)]">
<span class="material-symbols-outlined text-[14px]">add</span> Add
        </button>
</div>
<div class="font-mono text-xs text-white/80 bg-black/60 p-3 rounded-lg border border-white/5 overflow-x-auto shadow-inner relative z-10">
        docker image prune -a -f
      </div>
</div>
<!-- Preset Card 3 -->
<div class="p-4 rounded-xl glass-panel flex flex-col gap-3 relative overflow-hidden">
<div class="flex items-center justify-between relative z-10">
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-[#FF453A] shadow-[0_0_6px_#FF453A]"></div>
<span class="font-bold text-white text-sm">Stop All Containers</span>
</div>
<button class="px-3 py-1 rounded bg-accent-blue text-white text-xs font-bold flex items-center gap-1 shadow-[0_0_10px_rgba(10,132,255,0.4)]">
<span class="material-symbols-outlined text-[14px]">add</span> Add
        </button>
</div>
<div class="font-mono text-xs text-white/80 bg-black/60 p-3 rounded-lg border border-white/5 overflow-x-auto shadow-inner relative z-10">
        docker stop $(docker ps -a -q)
      </div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-[#1C1C1E]/80 backdrop-blur-xl border-t border-white/10 flex items-center justify-around pb-4 pt-2 px-2 z-50">
<button class="flex flex-col items-center gap-1 text-white/50 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[22px]">home</span>
<span class="text-[10px] font-medium font-sans">Home</span>
</button>
<button class="flex flex-col items-center gap-1 text-white/50 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[22px]">terminal</span>
<span class="text-[10px] font-medium font-sans">Terminal</span>
</button>
<button class="flex flex-col items-center gap-1 text-accent-blue">
<span class="material-symbols-outlined text-[22px]">code_blocks</span>
<span class="text-[10px] font-bold font-sans">Commands</span>
</button>
<button class="flex flex-col items-center gap-1 text-white/50 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[22px]">key</span>
<span class="text-[10px] font-medium font-sans">Keys</span>
</button>
<button class="flex flex-col items-center gap-1 text-white/50 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[22px]">settings</span>
<span class="text-[10px] font-medium font-sans">Settings</span>
</button>
</nav>
</body></html>
