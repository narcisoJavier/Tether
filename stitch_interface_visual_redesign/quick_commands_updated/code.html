<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Tether / OPA - Quick Commands</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "on-tertiary-container": "#4a1b00",

                  "on-secondary-fixed-variant": "#332dbc",
                  "surface-dim": "#10131b",
                  "surface-bright": "#363941",
                  "terminal-dim": "#8E8E93",
                  "neon-blue-glow": "#00CCFF",
                  "secondary": "#c2c1ff",
                  "inverse-primary": "#005db8",
                  "inverse-surface": "#e0e2ed",
                  "on-primary-container": "#002957",
                  "surface-container-high": "#262a32",
                  "on-primary": "#003064",
                  "surface-container-lowest": "#0b0e15",
                  "error": "#ffb4ab",
                  "error-container": "#93000a",
                  "outline": "#8b91a0",
                  "on-tertiary": "#552000",
                  "secondary-fixed": "#e2dfff",
                  "secondary-fixed-dim": "#c2c1ff",
                  "on-primary-fixed": "#001b3e",
                  "tertiary-container": "#eb6a12",
                  "outline-variant": "#414754",
                  "surface-container": "#1c2027",
                  "tertiary": "#ffb691",
                  "tertiary-fixed-dim": "#ffb691",
                  "on-secondary": "#1800a7",
                  "surface-tint": "#aac7ff",
                  "on-secondary-fixed": "#0c006b",
                  "glass-surface": "rgba(28, 28, 30, 0.7)",
                  "pip-warning": "#FFD60A",
                  "pip-success": "#32D74B",
                  "on-background": "#e0e2ed",
                  "surface-container-low": "#181c23",
                  "tertiary-fixed": "#ffdbcb",
                  "oled-black": "#000000",
                  "inverse-on-surface": "#2d3038",
                  "on-secondary-container": "#b1b1ff",
                  "on-primary-fixed-variant": "#00468d",

          "borderRadius": {
                  "DEFAULT": "0.25rem",
                  "lg": "0.5rem",
                  "xl": "0.75rem",
                  "full": "9999px"
          },
          "spacing": {
                  "stack-tight": "0.25rem",
                  "header-height": "36px",
                  "card-padding": "1.25rem",
                  "terminal-gutter": "1rem",
                  "chip-gap": "0.5rem"
          },
          "fontFamily": {
                  "body-lg": [
                          "Hanken Grotesk"
                  ],
                  "headline-lg": [
                          "Hanken Grotesk"
                  ],
                  "headline-md": [
                          "Hanken Grotesk"
                  ],
                  "pip-label": [
                          "JetBrains Mono"
                  ],
                  "code-display": [

                  "code-sm": [

          },
          "fontSize": {

                  ],
                  "label-caps": [

<style>
    @layer base { 
      body { background-color: #000000; -webkit-tap-highlight-color: transparent; } 
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); } 
      .pt-safe { padding-top: env(safe-area-inset-top); } 
    } 
    .glass-nav { 
      background: rgba(16, 19, 27, 0.8); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      border-top: 1px solid rgba(0, 204, 255, 0.2); 
    } 
    .glass-header { 
      background: rgba(16, 19, 27, 0.8); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); 
    }
    body { min-height: max(884px, 100dvh); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-oled-black text-on-surface font-body-lg overflow-x-hidden">
<header class="fixed top-0 w-full z-50 glass-header pt-safe shadow-[0_1px_12px_rgba(0,0,0,0.5)]">
<div class="h-14 px-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-pip-warning">bolt</span>
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest">Quick Commands</span>
</div>
<button class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-primary-container/20 border border-primary-container/40 text-primary-container font-label-caps text-[10px] uppercase tracking-wider hover:bg-primary-container/30 transition-colors">
<span class="material-symbols-outlined text-[14px]">add</span> New
      </button>
</div>
</header>
<main class="relative pt-20 pb-24 min-h-screen bg-oled-black">
<div class="flex flex-col w-full gap-4 px-4 max-w-2xl mx-auto">
<!-- Command Card 1 -->
<div class="relative bg-surface-container/60 backdrop-blur-md rounded-xl p-4 border border-outline-variant/20 shadow-md transition-all hover:bg-surface-container/80 hover:border-outline-variant/40 group">
<div class="flex items-start justify-between mb-3">
<div class="flex flex-col gap-1">
<span class="font-headline-md text-[16px] text-on-surface">Docker Container Logs</span>
<div class="flex items-center gap-2">
<span class="inline-flex items-center justify-center px-2 py-0.5 rounded-full bg-primary-container/10 border border-primary-container/30 font-code-sm text-[10px] text-primary-container font-bold">
                prowl-redis-01
              </span>
</div>
</div>
<button class="relative flex items-center justify-center w-8 h-8 rounded-full bg-pip-warning/10 border border-pip-warning/30 text-pip-warning transition-all active:scale-90 hover:bg-pip-warning/20">
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:rotate-12">play_arrow</span>
</button>
</div>
<div class="bg-surface-container-lowest/80 rounded-lg p-3 border border-outline-variant/10 relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-pip-warning/20"></div>
<div class="font-code-sm text-code-sm text-terminal-dim flex items-center gap-2 overflow-x-auto whitespace-nowrap hide-scrollbar">
<span class="text-pip-warning/70 shrink-0">$</span>
<span class="text-on-surface-variant font-medium">docker logs --tail 100 -f redis-primary</span>
</div>
</div>
</div>
<!-- Command Card 2 -->
<div class="relative bg-surface-container/60 backdrop-blur-md rounded-xl p-4 border border-outline-variant/20 shadow-md transition-all hover:bg-surface-container/80 hover:border-outline-variant/40 group">
<div class="flex items-start justify-between mb-3">
<div class="flex flex-col gap-1">
<span class="font-headline-md text-[16px] text-on-surface">Nginx Config Test &amp; Reload</span>
<div class="flex items-center gap-2">
<span class="inline-flex items-center justify-center px-2 py-0.5 rounded-full bg-primary-container/10 border border-primary-container/30 font-code-sm text-[10px] text-primary-container font-bold">
                All Servers
              </span>
</div>
</div>
<button class="relative flex items-center justify-center w-8 h-8 rounded-full bg-pip-warning/10 border border-pip-warning/30 text-pip-warning transition-all active:scale-90 hover:bg-pip-warning/20">
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:rotate-12">play_arrow</span>
</button>
</div>
<div class="bg-surface-container-lowest/80 rounded-lg p-3 border border-outline-variant/10 relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-pip-warning/20"></div>
<div class="font-code-sm text-code-sm text-terminal-dim flex flex-col gap-1 overflow-x-auto whitespace-nowrap hide-scrollbar">
<div class="flex items-center gap-2">
<span class="text-pip-warning/70 shrink-0">$</span>
<span class="text-on-surface-variant font-medium">sudo nginx -t &amp;&amp; sudo systemctl reload nginx</span>
</div>
</div>
</div>
</div>
</div>
</main>
<nav class="fixed bottom-0 w-full z-50 glass-nav pb-safe">
<div class="flex justify-between items-center h-16 px-2">
<a class="flex-1 flex flex-col items-center justify-center gap-1 text-terminal-dim transition-colors h-full" href="#">
<span class="material-symbols-outlined text-[22px]">terminal</span>
<span class="font-label-caps text-[10px] uppercase tracking-tighter">Home</span>
</a>
<a class="flex-1 flex flex-col items-center justify-center gap-1 text-terminal-dim transition-colors h-full" href="#">
<span class="material-symbols-outlined text-[22px]">code</span>
<span class="font-label-caps text-[10px] uppercase tracking-tighter">Terminal</span>
</a>
<a aria-current="page" class="flex-1 flex flex-col items-center justify-center gap-1 text-neon-blue-glow transition-colors h-full" href="#">
<span class="material-symbols-outlined text-[22px]">list_alt</span>
<span class="font-label-caps text-[10px] uppercase tracking-tighter">Commands</span>
</a>
<a class="flex-1 flex flex-col items-center justify-center gap-1 text-terminal-dim transition-colors h-full" href="#">
<span class="material-symbols-outlined text-[22px]">key</span>
<span class="font-label-caps text-[10px] uppercase tracking-tighter">Keys</span>
</a>
<a class="flex-1 flex flex-col items-center justify-center gap-1 text-terminal-dim transition-colors h-full" href="#">
<span class="material-symbols-outlined text-[22px]">settings_input_component</span>
<span class="font-label-caps text-[10px] uppercase tracking-tighter">Settings</span>
</a>
</div>
</nav>
</body></html>
