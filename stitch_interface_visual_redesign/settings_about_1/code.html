</div>
<div class="w-12 h-6 rounded-full bg-primary-container p-0.5 flex items-center justify-end shadow-inner">
<div class="w-5 h-5 rounded-full bg-white shadow-sm"></div>
</div>
</div>
</div>

<div class="p-card-padding rounded-xl bg-surface-container-low border border-outline-variant/30 flex items-center justify-between">
