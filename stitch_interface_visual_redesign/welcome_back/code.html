<!-- Background Ambient Glow -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-neon-blue-glow/5 rounded-full blur-[100px] pointer-events-none"></div>

<div class="absolute inset-2 rounded-full border border-primary/20 border-dashed animate-[spin_12s_linear_infinite_reverse]"></div>
<!-- Core Image -->
<img alt="System Core Logo" class="w-28 h-28 rounded-full object-cover z-10 brightness-110 contrast-125 saturate-50 mix-blend-screen shadow-[0_0_20px_rgba(0,204,255,0.4)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDcAk5pYwZkDnH1ul1qBzXBDUdq4VL4J_5r-yKF_j4fDeovynJ8M2jS-hUt6xS_s9_haYnXBYTNQ-vo5iqtlUeu9BsGU0nC_Y7J_aLekcGgFcNSVFeI26utf7sqIFs52pKcypeMzpChS5tf3LCJVz91CqypdN2zQo87qFGeGazy_L6KJjRQ2c3ISach2cmh1q3h_08keEUBI6ab3-nmMjpPlMFLSb96sTrNzB1R8gmEMFB4S1lQaWZO5ugMpyrhxzpgUQ">
<!-- Center Pulse overlay -->
<div class="absolute inset-0 bg-neon-blue-glow/10 rounded-full mix-blend-overlay animate-pulse pointer-events-none"></div>
</div>
<div class="text-center flex flex-col gap-1">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tighter shadow-neon-blue-glow">Tether</h1>
<p class="font-label-caps text-label-caps text-terminal-dim uppercase tracking-[0.2em]">Welcome back</p>
</div>
</div>
<!-- Terminal Output Log -->
<div class="flex-1 w-full max-w-md mx-auto mt-12 mb-8 relative z-10">
<div class="bg-glass-surface backdrop-blur-[20px] rounded-xl p-4 shadow-lg relative overflow-hidden shadow-[inset_0_0_0_0.5px_rgba(255,255,255,0.1)]">
<!-- Fake Window Controls -->
<div class="flex items-center gap-2 mb-4 pb-2 shadow-[0_1px_0_rgba(255,255,255,0.05)]">
<div class="w-2 h-2 rounded-full bg-error"></div>
<div class="w-2 h-2 rounded-full bg-pip-warning"></div>
<div class="w-2 h-2 rounded-full bg-pip-success"></div>
<span class="font-pip-label text-pip-label text-terminal-dim ml-2 uppercase tracking-widest">Boot Sequence</span>
</div>
<!-- Log Content -->
<div class="font-code-sm text-code-sm text-on-surface-variant flex flex-col gap-2 min-h-[140px]" id="boot-logs">
<!-- Populated by JS -->
<div class="flex items-start gap-2 transition-opacity duration-300"><span class="text-pip-success">[OK]</span><span class="text-on-surface">Kernel loaded</span></div><div class="flex items-start gap-2 transition-opacity duration-300"><span class="text-pip-success">[OK]</span><span class="text-on-surface">Hive initialized</span></div><div class="flex items-start gap-2 transition-opacity duration-300"><span class="text-pip-success">[OK]</span><span class="text-on-surface">Keystore verified</span></div><div class="flex items-start gap-2 transition-opacity duration-300"><span class="text-pip-success">[OK]</span><span class="text-on-surface">Neural link established</span></div><div class="flex items-start gap-2 transition-opacity duration-300"><span class="text-neon-blue-glow">[SYS]</span><span class="text-on-surface">Awaiting biometric payload...</span></div><div class="flex items-start gap-2 mt-1"><span class="text-neon-blue-glow animate-pulse font-bold">_</span></div></div>

<div class="absolute inset-0 rounded-xl bg-neon-blue-glow/10 blur-xl transition-opacity duration-300 opacity-50 group-active:opacity-100"></div>

<div class="relative w-12 h-12 flex items-center justify-center">
<span class="material-symbols-outlined text-[40px] text-neon-blue-glow transition-transform duration-300 group-active:scale-90" style="font-variation-settings: &quot;FILL&quot; 0;">fingerprint</span>
<!-- Scanner line -->
<div class="absolute top-0 w-full h-[2px] bg-neon-blue-glow shadow-[0_0_8px_rgba(0,204,255,0.8)] opacity-0 group-active:opacity-100 group-active:translate-y-12 transition-all duration-700 ease-in-out"></div>
</div>
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-pip-warning animate-pulse" id="auth-status-dot"></div>
<span class="font-label-caps text-label-caps text-on-surface tracking-widest uppercase" id="auth-status-text">Authenticate</span>
</div>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const logsContainer = document.getElementById('boot-logs');
        const sequences = [
            { text: "Kernel loaded", status: "[OK]", color: "text-pip-success" },
            { text: "Hive initialized", status: "[OK]", color: "text-pip-success" },
            { text: "Keystore verified", status: "[OK]", color: "text-pip-success" },
            { text: "Neural link established", status: "[OK]", color: "text-pip-success" },
            { text: "Awaiting biometric payload...", status: "[SYS]", color: "text-neon-blue-glow" }
        ];

        let index = 0;
        
        function renderLine(seq) {
            const line = document.createElement('div');
            line.className = 'flex items-start gap-2 opacity-0 transition-opacity duration-300';
            line.innerHTML = `<span class="${seq.color}">${seq.status}</span><span class="text-on-surface">${seq.text}</span>`;
            logsContainer.appendChild(line);
            
            // Trigger reflow to animate opacity
            void line.offsetWidth;
            line.classList.remove('opacity-0');
        }

        function typeSequence() {
            if (index < sequences.length) {
                renderLine(sequences[index]);
                index++;
                setTimeout(typeSequence, 400 + Math.random() * 400); // Random delay between lines
            } else {
                // Add blinking cursor at the end
                const cursorLine = document.createElement('div');
                cursorLine.className = 'flex items-start gap-2 mt-1';
                cursorLine.innerHTML = `<span class="text-neon-blue-glow animate-pulse font-bold">_</span>`;
                logsContainer.appendChild(cursorLine);
            }
        }

        setTimeout(typeSequence, 600);

        // Mock Authentication Interaction
        const unlockBtn = document.getElementById('unlock-btn');
        const statusText = document.getElementById('auth-status-text');
        const statusDot = document.getElementById('auth-status-dot');
        const fingerprintIcon = unlockBtn.querySelector('.material-symbols-outlined');

        let isAuthenticating = false;

        unlockBtn.addEventListener('mousedown', () => {
            if(isAuthenticating) return;
            isAuthenticating = true;
            
            statusText.textContent = 'Verifying...';
            statusText.classList.add('text-neon-blue-glow');
            statusDot.classList.replace('bg-pip-warning', 'bg-neon-blue-glow');
            fingerprintIcon.style.fontVariationSettings = "'FILL' 1";
            
            // Mock success delay
            setTimeout(() => {
                statusText.textContent = 'Access Granted';
                statusText.classList.replace('text-neon-blue-glow', 'text-pip-success');
                statusDot.classList.replace('bg-neon-blue-glow', 'bg-pip-success');
                statusDot.classList.remove('animate-pulse');
                fingerprintIcon.classList.replace('text-neon-blue-glow', 'text-pip-success');
                
                unlockBtn.querySelector('.bg-glass-surface').classList.replace('shadow-[inset_0_0_0_1px_rgba(0,204,255,0.2)]', 'shadow-[inset_0_0_0_1px_rgba(50,215,75,0.4)]');
                unlockBtn.querySelector('.bg-neon-blue-glow\\/10').classList.replace('bg-neon-blue-glow/10', 'bg-pip-success/20');
            }, 1200);
        });

        // Touch support for mobile
        unlockBtn.addEventListener('touchstart', (e) => {
            // Prevent default to avoid double firing with mousedown
            if(!isAuthenticating) {
                unlockBtn.dispatchEvent(new Event('mousedown'));
            }
        }, {passive: true});
    });
</script></main><nav class="fixed bottom-0 w-full z-50 glass-nav pb-safe" data-active-classes="text-neon-blue-glow"><div class="flex justify-between items-center h-16 px-2"><a aria-current="page" class="flex-1 flex flex-col items-center justify-center gap-1 transition-colors h-full text-neon-blue-glow" data-path="home" href="#"><span class="material-symbols-outlined text-[22px]">terminal</span><span class="font-label-caps text-[10px] uppercase tracking-tighter">Home</span></a><a class="flex-1 flex flex-col items-center justify-center gap-1 text-terminal-dim transition-colors h-full" data-path="terminal" href="#"><span class="material-symbols-outlined text-[22px]">code</span><span class="font-label-caps text-[10px] uppercase tracking-tighter">Terminal</span></a><a class="flex-1 flex flex-col items-center justify-center gap-1 text-terminal-dim transition-colors h-full" data-path="commands" href="#"><span class="material-symbols-outlined text-[22px]">list_alt</span><span class="font-label-caps text-[10px] uppercase tracking-tighter">Commands</span></a><a class="flex-1 flex flex-col items-center justify-center gap-1 text-terminal-dim transition-colors h-full" data-path="keys" href="#"><span class="material-symbols-outlined text-[22px]">key</span><span class="font-label-caps text-[10px] uppercase tracking-tighter">Keys</span></a><a class="flex-1 flex flex-col items-center justify-center gap-1 text-terminal-dim transition-colors h-full" data-path="settings" href="#"><span class="material-symbols-outlined text-[22px]">settings_input_component</span><span class="font-label-caps text-[10px] uppercase tracking-tighter">Settings</span></a></div></nav>
