<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Tether / OPA - SSH Profile Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "on-tertiary-container": "#4a1b00",
                  "primary-fixed-dim": "#aac7ff",
                  "on-tertiary-fixed-variant": "#793100",

                  "on-surface-variant": "#c0c6d6",
                  "primary": "#aac7ff",
                  "surface": "#10131b",
                  "background": "#10131b",
                  "on-error-container": "#ffdad6",
                  "on-secondary-fixed-variant": "#332dbc",
                  "surface-dim": "#10131b",
                  "surface-bright": "#363941",
                  "terminal-dim": "#8E8E93",
                  "neon-blue-glow": "#00CCFF",
                  "secondary": "#c2c1ff",
                  "inverse-primary": "#005db8",
                  "inverse-surface": "#e0e2ed",
                  "on-primary-container": "#002957",
                  "surface-container-high": "#262a32",
                  "on-primary": "#003064",
                  "surface-container-lowest": "#0b0e15",
                  "error": "#ffb4ab",
                  "error-container": "#93000a",
                  "outline": "#8b91a0",
                  "on-tertiary": "#552000",
                  "secondary-fixed": "#e2dfff",
                  "secondary-fixed-dim": "#c2c1ff",
                  "on-primary-fixed": "#001b3e",
                  "tertiary-container": "#eb6a12",
                  "outline-variant": "#414754",
                  "surface-container": "#1c2027",
                  "tertiary": "#ffb691",
                  "tertiary-fixed-dim": "#ffb691",
                  "on-secondary": "#1800a7",
                  "surface-tint": "#aac7ff",
                  "on-secondary-fixed": "#0c006b",
                  "glass-surface": "rgba(28, 28, 30, 0.7)",
                  "pip-warning": "#FFD60A",
                  "pip-success": "#32D74B",
                  "on-background": "#e0e2ed",
                  "surface-container-low": "#181c23",
                  "tertiary-fixed": "#ffdbcb",
                  "oled-black": "#000000",
                  "inverse-on-surface": "#2d3038",
                  "on-secondary-container": "#b1b1ff",
                  "on-primary-fixed-variant": "#00468d",
                  "on-tertiary-fixed": "#341100",
                  "surface-variant": "#31353d",
                  "secondary-container": "#3630bf",
                  "surface-container-highest": "#31353d",
                  "primary-container": "#3e90ff",
                  "on-surface": "#e0e2ed",
                  "on-error": "#690005",
                  "primary-fixed": "#d6e3ff"
          },
          "borderRadius": {
                  "DEFAULT": "0.25rem",
                  "lg": "0.5rem",
                  "xl": "0.75rem",
                  "full": "9999px"
          },
          "spacing": {
                  "stack-tight": "0.25rem",
                  "header-height": "36px",
                  "card-padding": "1.25rem",
                  "terminal-gutter": "1rem",
                  "chip-gap": "0.5rem"
          },
          "fontFamily": {
                  "body-lg": [
                          "Hanken Grotesk"
                  ],
                  "headline-lg": [
                          "Hanken Grotesk"
                  ],
                  "headline-md": [
                          "Hanken Grotesk"
                  ],
                  "pip-label": [
                          "JetBrains Mono"
                  ],
                  "code-display": [

                  ],
                  "label-caps": [
                          "JetBrains Mono"
                  ],
                  "code-sm": [
                          "JetBrains Mono"
                  ]
          },
          "fontSize": {
                  "body-lg": [
                          "16px",

                                  "lineHeight": "24px",
                                  "fontWeight": "400"
                          }

                  "headline-lg": [
                          "32px",

                                  "lineHeight": "40px",
                                  "letterSpacing": "-0.02em",
                                  "fontWeight": "700"

                  ],
                  "headline-md": [
                          "24px",

                                  "fontWeight": "600"

                  "pip-label": [

                                  "lineHeight": "12px",
                                  "fontWeight": "800"
                          }
                  ],
                  "code-display": [
                          "15px",
                          {
                                  "lineHeight": "22px",
                                  "fontWeight": "500"
                          }
                  ],
                  "label-caps": [
                          "11px",

                                  "lineHeight": "14px",
                                  "letterSpacing": "0.08em",
                                  "fontWeight": "700"

                  "code-sm": [
                          "12px",
                          {
                                  "lineHeight": "16px",
                                  "fontWeight": "400"

    }
  </script>
<style>
    body { background-color: #10131b; color: #e0e2ed; font-family: 'Hanken Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-background min-h-screen p-4 flex flex-col justify-between">
<header class="flex items-center justify-between py-2 border-b border-outline-variant/50 mb-4">
<div class="flex items-center gap-2">
<button class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-sm">arrow_back</span>
</button>
<h1 class="text-[16px] font-headline-md text-on-surface">Edit SSH Connection</h1>
</div>
<button class="px-3 py-1.5 rounded-lg bg-primary-container text-white text-[12px] font-semibold tracking-wide">Save Profile</button>
</header>
<main class="flex-1 flex flex-col gap-4">
<!-- Server Label -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-on-surface-variant uppercase">Server Label</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container/50 border border-outline-variant text-on-surface font-body-lg focus:outline-none focus:border-primary-container focus:bg-surface-container transition-all" type="text" value="prowl-redis-01">
</div>
<!-- Host & Port -->
<div class="grid grid-cols-3 gap-3">
<div class="col-span-2 flex flex-col gap-1.5">
<label class="font-label-caps text-on-surface-variant uppercase">Host IP / Domain</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container/50 border border-outline-variant text-on-surface font-code-sm focus:outline-none focus:border-primary-container focus:bg-surface-container transition-all" type="text" value="10.0.4.12">
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-on-surface-variant uppercase">Port</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container/50 border border-outline-variant text-on-surface font-code-sm focus:outline-none focus:border-primary-container focus:bg-surface-container transition-all" type="text" value="22">
</div>
</div>
<!-- Username -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-on-surface-variant uppercase">Username</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container/50 border border-outline-variant text-on-surface font-code-sm focus:outline-none focus:border-primary-container focus:bg-surface-container transition-all" type="text" value="uznir">
</div>
<!-- Authentication Method Selector -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-on-surface-variant uppercase">Auth Method</label>
<div class="grid grid-cols-3 p-1 rounded-xl bg-surface-container border border-outline-variant text-[13px] font-semibold">
<button class="py-2 rounded-lg bg-surface-variant text-on-surface shadow-sm border border-outline-variant/30">Public Key</button>
<button class="py-2 text-on-surface-variant hover:text-on-surface transition-colors">Password</button>
<button class="py-2 text-on-surface-variant hover:text-on-surface transition-colors">Key + Pass</button>
</div>
</div>
<!-- Tailscale Mesh Switch -->
<div class="p-4 rounded-xl bg-surface-container/50 border border-outline-variant flex items-center justify-between">
<div class="flex flex-col gap-0.5">
<span class="text-[15px] font-semibold text-on-surface">Route via Tailscale</span>
<span class="font-code-sm text-on-surface-variant">Use WireGuard mesh connection</span>
</div>
<div class="w-12 h-6 rounded-full bg-primary-container p-1 flex items-center justify-end">
<div class="w-4 h-4 rounded-full bg-white shadow-sm"></div>
</div>
</div>
<!-- Test Connection Button -->
<button class="w-full mt-2 py-3 rounded-xl bg-surface-container border border-primary-container/40 text-primary-container font-semibold text-[15px] flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-sm">wifi_tethering</span> Test Connection
    </button>
</main>
</body></html>
