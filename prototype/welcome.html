<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Tether / OPA - Welcome Boot & Biometric Gate</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "oled-black": "#000000",
            "surface-0": "#1C1C1E",
            "surface-1": "#2C2C2E",
            "accent-blue": "#0A84FF",
            "neon-blue-glow": "#00CCFF",
            "pip-success": "#32D74B"
          },
          fontFamily: {
            mono: ["JetBrains Mono", "monospace"],
            sans: ["Hanken Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #000000; color: #E0E2ED; font-family: 'Hanken Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-oled-black min-h-screen flex flex-col items-center justify-center p-6 text-center">
  
  <div class="w-full max-w-sm flex flex-col items-center gap-6">
    <!-- Glow Logo Icon -->
    <div class="relative w-20 h-20 rounded-2xl bg-accent-blue/10 border border-accent-blue/40 flex items-center justify-center text-accent-blue shadow-[0_0_30px_rgba(10,132,255,0.3)]">
      <span class="material-symbols-outlined text-4xl">terminal</span>
    </div>

    <!-- Title & Subtitle -->
    <div class="flex flex-col gap-1">
      <h1 class="text-2xl font-bold text-white tracking-tight">Tether — Pocket SSH</h1>
      <p class="text-xs font-mono text-white/50">v0.5.0 • OpenSSH Pocket Agent</p>
    </div>

    <!-- Typewriter Boot Terminal Box -->
    <div class="w-full p-4 rounded-xl bg-surface-0 border border-white/10 font-mono text-xs text-left flex flex-col gap-1.5 shadow-xl">
      <div class="flex items-center gap-1.5 text-pip-success">
        <span class="material-symbols-outlined text-sm">check_circle</span>
        <span>Hive Storage Initialized</span>
      </div>
      <div class="flex items-center gap-1.5 text-pip-success">
        <span class="material-symbols-outlined text-sm">check_circle</span>
        <span>Android Keystore Unlocked</span>
      </div>
      <div class="flex items-center gap-1.5 text-accent-blue">
        <span class="material-symbols-outlined text-sm">sync</span>
        <span>Initializing Tailscale Mesh...</span>
      </div>
    </div>

    <!-- Biometric Unlock Button -->
    <button class="w-full py-3.5 rounded-xl bg-accent-blue hover:bg-accent-blue/90 text-white font-semibold text-sm transition-all shadow-[0_0_20px_rgba(10,132,255,0.4)] flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-lg">fingerprint</span> Unlock with Biometrics
    </button>
  </div>

</body>
</html>
