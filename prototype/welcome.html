<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPA — Welcome Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0e17;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  position: relative;
}

#particles-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.viewport {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 9 / 16;
  background: rgba(10, 14, 23, 0.6);
  backdrop-filter: blur(4px);
  border-radius: 40px;
  border: 1px solid rgba(255, 255, 255, 0.04);
  box-shadow:
    0 0 60px rgba(0, 230, 118, 0.03),
    inset 0 0 80px rgba(0, 0, 0, 0.4);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 28px;
  overflow: hidden;
}

.hex-wrap {
  position: relative;
  width: 160px;
  height: 160px;
  margin-bottom: 32px;
  flex-shrink: 0;
}

.hex-svg {
  width: 100%;
  height: 100%;
  display: block;
  animation: hexPulse 3s ease-in-out infinite;
}

@keyframes hexPulse {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 230, 118, 0.15)) drop-shadow(0 0 20px rgba(0, 230, 118, 0.05)); }
  50% { filter: drop-shadow(0 0 12px rgba(0, 230, 118, 0.3)) drop-shadow(0 0 40px rgba(0, 230, 118, 0.1)); }
}

.hex-border {
  fill: none;
  stroke: #00e676;
  stroke-width: 1.8;
  stroke-linejoin: round;
  opacity: 0.55;
  animation: hexStroke 3s ease-in-out infinite;
}

@keyframes hexStroke {
  0%, 100% { opacity: 0.55; stroke-width: 1.8; }
  50% { opacity: 0.85; stroke-width: 2.2; }
}

.ascii-art {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  line-height: 1.15;
  color: #00e676;
  opacity: 0.8;
  text-align: center;
  pointer-events: none;
  animation: fadeAscii 0.8s ease-out both;
  letter-spacing: -0.5px;
}

@keyframes fadeAscii {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 0.8; transform: scale(1); }
}

.ripple-container {
  position: absolute;
  inset: -20px;
  pointer-events: none;
}

.ripple {
  position: absolute;
  inset: 0;
  border: 1.5px solid rgba(0, 230, 118, 0.2);
  border-radius: 50%;
  animation: rippleExpand 3.2s ease-out infinite;
}

.ripple:nth-child(2) { animation-delay: 1s; }
.ripple:nth-child(3) { animation-delay: 2s; }

@keyframes rippleExpand {
  0% { transform: scale(0.85); opacity: 0.6; }
  100% { transform: scale(1.5); opacity: 0; }
}

.text-block {
  text-align: center;
  margin-bottom: 40px;
}

.welcome-text {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 26px;
  color: rgba(255, 255, 255, 0.85);
  letter-spacing: -0.3px;
  animation: fadeUp 0.8s 0.3s both ease-out;
}

.subtitle {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: 0.4px;
  margin-top: 8px;
  animation: fadeUp 0.8s 0.5s both ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.progress-track {
  width: 180px;
  height: 2px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 4px;
  overflow: hidden;
  animation: fadeUp 0.8s 0.7s both ease-out;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, rgba(0, 230, 118, 0.3), #00e676);
  border-radius: 4px;
  animation: fillBar 1.2s 0.9s both ease-out;
}

@keyframes fillBar {
  from { width: 0%; }
  to { width: 100%; }
}

@media (max-width: 440px) {
  .viewport { border-radius: 0; max-width: 100%; }
  .hex-wrap { width: 130px; height: 130px; }
  .welcome-text { font-size: 22px; }
}
</style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="viewport">

  <div class="hex-wrap">
    <svg class="hex-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon class="hex-border" points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5"/>
    </svg>
    <div class="ascii-art" id="ascii-art"></div>
    <div class="ripple-container">
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="ripple"></div>
    </div>
  </div>

  <div class="text-block">
    <div class="welcome-text">Welcome back</div>
    <div class="subtitle">OPA — OpenSSH Pocket Agent</div>
  </div>

  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>

</div>

<script>
const asciiPieces = [
  `╔═══╗╔══╗╔═╗╔═╗
╚╗╔╗║║╔╗║║║╚╝║║
 ║║║║║║║║║╔╗╔╗║
 ║║║║║║║║║║║║║║
╔╝╚╝║║╚╝║║║║║║║
╚═══╝╚══╝╚╝╚╝╚╝`,
  `  ___   ___   _    _  
 / _ \\ / _ \\ | |  | | 
| | | | | | || |  | | 
| | | | | | || |  | | 
| |_| | |_| || |__| | 
 \\___/  \\___/  \\____/`,
  `┌─┐┬┌─┐┌┐┌┌─┐
│ ┬││ ┬│││├┤ 
└─┘┴└─┘┘└┘└─┘`,
  `  .--.   .---.  
 /    \\ /     \\ 
| .--. | .--. | 
| |  | | |  | | 
| '--' | '--' | 
 '----'  '----'`,
  `╔═╗╦═╗╔═╗╔═╗╔╦╗
╠═╣╠╦╝║ ║║ ║ ║ 
╩ ╩╩╚═╚═╝╚═╝ ╩ `,
  `   /\\    /\\   
  /  \\  /  \\  
 / /\\ \\/ /\\ \\ 
| /  \\/  \\/ ||
| \\  /\\  / / |
 \\ \\/ /\\/ / / 
  \\  /\\/ / /  
   \\/  \\/ /   
    \\   \\/    
     \\_/\\_`,
  `┌┬┐┌─┐┌─┐┬ ┬┬
 │││├┤ │  ├─┤│
─┴┘└─┘└─┘┴ ┴┴`,
];

document.getElementById('ascii-art').textContent = asciiPieces[Math.floor(Math.random() * asciiPieces.length)];

const canvas = document.getElementById('particles-canvas');
const ctx = canvas.getContext('2d');
let W, H;
const particles = [];
const PARTICLE_COUNT = 80;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.r = Math.random() * 2 + 0.5;
    this.dx = (Math.random() - 0.5) * 0.35;
    this.dy = (Math.random() - 0.5) * 0.35;
    this.alpha = Math.random() * 0.35 + 0.05;
    this.life = 0;
    this.maxLife = Math.random() * 300 + 200;
  }
  update() {
    this.x += this.dx;
    this.y += this.dy;
    this.life++;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H || this.life > this.maxLife) {
      this.reset();
      this.x = Math.random() * W;
      this.y = Math.random() * H;
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 230, 118, ${this.alpha})`;
    ctx.fill();
  }
}

for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

function animParticles() {
  ctx.clearRect(0, 0, W, H);
  for (const p of particles) { p.update(); p.draw(); }
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 100) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(0, 230, 118, ${0.06 * (1 - dist / 100)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animParticles);
}
animParticles();
</script>

</body>
</html>
