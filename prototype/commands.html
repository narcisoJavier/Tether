<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Tether / OPA - Quick Commands</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "oled-black": "#000000",
            "surface-0": "#1C1C1E",
            "surface-1": "#2C2C2E",
            "accent-blue": "#0A84FF",
            "accent-amber": "#FF9F0A"
          },
          fontFamily: {
            mono: ["JetBrains Mono", "monospace"],
            sans: ["Hanken Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #000000; color: #E0E2ED; font-family: 'Hanken Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-oled-black min-h-screen p-4 flex flex-col gap-4">
  
  <header class="flex items-center justify-between py-2">
    <h1 class="text-xl font-bold text-white flex items-center gap-2">
      <span class="material-symbols-outlined text-accent-amber">bolt</span> Quick Commands
    </h1>
    <button class="px-3 py-1.5 rounded-lg bg-accent-blue/20 border border-accent-blue/40 text-accent-blue text-xs font-semibold flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">add</span> New Command
    </button>
  </header>

  <main class="flex flex-col gap-3">
    <!-- Command Card 1 -->
    <div class="p-4 rounded-xl bg-surface-0 border border-white/5 flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="font-semibold text-white text-sm">Docker Container Logs</span>
          <span class="px-2 py-0.5 rounded text-[9px] font-mono bg-accent-blue/10 text-accent-blue font-bold">prowl-redis-01</span>
        </div>
        <button class="w-8 h-8 rounded-lg bg-accent-amber/20 border border-accent-amber/40 text-accent-amber flex items-center justify-center">
          <span class="material-symbols-outlined text-sm">play_arrow</span>
        </button>
      </div>
      <div class="font-mono text-xs text-white/60 bg-black/40 p-2.5 rounded-lg border border-white/5 overflow-x-auto">
        docker logs --tail 100 -f redis-primary
      </div>
    </div>

    <!-- Command Card 2 -->
    <div class="p-4 rounded-xl bg-surface-0 border border-white/5 flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="font-semibold text-white text-sm">Nginx Config Test & Reload</span>
          <span class="px-2 py-0.5 rounded text-[9px] font-mono bg-emerald-500/10 text-emerald-400 font-bold">All Servers</span>
        </div>
        <button class="w-8 h-8 rounded-lg bg-accent-amber/20 border border-accent-amber/40 text-accent-amber flex items-center justify-center">
          <span class="material-symbols-outlined text-sm">play_arrow</span>
        </button>
      </div>
      <div class="font-mono text-xs text-white/60 bg-black/40 p-2.5 rounded-lg border border-white/5 overflow-x-auto">
        sudo nginx -t && sudo systemctl reload nginx
      </div>
    </div>
  </main>

</body>
</html>
