<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Tether / OPA - SSH Profile Editor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "oled-black": "#000000",
            "surface-0": "#1C1C1E",
            "surface-1": "#2C2C2E",
            "accent-blue": "#0A84FF",
            "pip-success": "#32D74B"
          },
          fontFamily: {
            mono: ["JetBrains Mono", "monospace"],
            sans: ["Hanken Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #000000; color: #E0E2ED; font-family: 'Hanken Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-oled-black min-h-screen p-4 flex flex-col justify-between">
  
  <header class="flex items-center justify-between py-2 border-b border-white/10 mb-4">
    <div class="flex items-center gap-2">
      <button class="w-8 h-8 rounded-full bg-surface-1 flex items-center justify-center text-white/70">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
      </button>
      <h1 class="text-lg font-bold text-white">Edit SSH Connection</h1>
    </div>
    <button class="px-3 py-1.5 rounded-lg bg-accent-blue text-white text-xs font-semibold">Save Profile</button>
  </header>

  <main class="flex-1 flex flex-col gap-4">
    <!-- Server Label -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-mono uppercase text-white/50">Server Label</label>
      <input type="text" value="prowl-redis-01" class="w-full px-4 py-3 rounded-xl bg-surface-0 border border-white/10 text-white font-semibold text-sm focus:outline-none focus:border-accent-blue"/>
    </div>

    <!-- Host & Port -->
    <div class="grid grid-cols-3 gap-3">
      <div class="col-span-2 flex flex-col gap-1.5">
        <label class="text-xs font-mono uppercase text-white/50">Host IP / Domain</label>
        <input type="text" value="10.0.4.12" class="w-full px-4 py-3 rounded-xl bg-surface-0 border border-white/10 text-white font-mono text-sm focus:outline-none focus:border-accent-blue"/>
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-mono uppercase text-white/50">Port</label>
        <input type="text" value="22" class="w-full px-4 py-3 rounded-xl bg-surface-0 border border-white/10 text-white font-mono text-sm focus:outline-none focus:border-accent-blue"/>
      </div>
    </div>

    <!-- Username -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-mono uppercase text-white/50">Username</label>
      <input type="text" value="uznir" class="w-full px-4 py-3 rounded-xl bg-surface-0 border border-white/10 text-white font-mono text-sm focus:outline-none focus:border-accent-blue"/>
    </div>

    <!-- Authentication Method Selector -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-mono uppercase text-white/50">Auth Method</label>
      <div class="grid grid-cols-3 p-1 rounded-xl bg-surface-0 border border-white/10 text-xs font-semibold">
        <button class="py-2 rounded-lg bg-surface-1 text-white shadow">Public Key</button>
        <button class="py-2 text-white/50">Password</button>
        <button class="py-2 text-white/50">Key + Pass</button>
      </div>
    </div>

    <!-- Tailscale Mesh Switch -->
    <div class="p-4 rounded-xl bg-surface-0 border border-white/10 flex items-center justify-between">
      <div class="flex flex-col gap-0.5">
        <span class="text-sm font-semibold text-white">Route via Tailscale</span>
        <span class="text-xs font-mono text-white/40">Use WireGuard mesh connection</span>
      </div>
      <div class="w-12 h-6 rounded-full bg-accent-blue p-1 flex items-center justify-end">
        <div class="w-4 h-4 rounded-full bg-white"></div>
      </div>
    </div>

    <!-- Test Connection Button -->
    <button class="w-full py-3 rounded-xl bg-surface-1 border border-accent-blue/40 text-accent-blue font-semibold text-sm flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-sm">wifi_tethering</span> Test Connection
    </button>
  </main>

</body>
</html>
