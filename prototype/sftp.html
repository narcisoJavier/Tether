<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Tether / OPA - SFTP Remote File Browser</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "oled-black": "#000000",
            "neon-blue-glow": "#00CCFF",
            "surface-0": "#1C1C1E",
            "surface-1": "#2C2C2E",
            "surface-2": "#3A3A3C",
            "accent-blue": "#0A84FF"
          },
          fontFamily: {
            mono: ["JetBrains Mono", "monospace"],
            sans: ["Hanken Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #000000; color: #E0E2ED; font-family: 'Hanken Grotesk', sans-serif; }
    .glass-header { background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-oled-black min-h-screen flex flex-col justify-between">
  
  <!-- Header with Breadcrumbs -->
  <header class="glass-header sticky top-0 w-full z-50 p-4">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <button class="w-8 h-8 rounded-full bg-surface-1 flex items-center justify-center text-white/70">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
        </button>
        <span class="font-bold text-lg text-white">SFTP Browser</span>
      </div>
      <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-accent-blue/20 border border-accent-blue/40 text-accent-blue text-xs font-semibold">
        <span class="material-symbols-outlined text-sm">terminal</span> Terminal
      </button>
    </div>

    <!-- Path Breadcrumb Bar -->
    <div class="flex items-center gap-1 overflow-x-auto no-scrollbar font-mono text-xs text-white/60 bg-surface-0 px-3 py-2 rounded-lg border border-white/5">
      <span class="text-accent-blue font-bold">root</span> /
      <span>var</span> /
      <span>log</span> /
      <span class="text-white font-semibold">nginx</span>
    </div>
  </header>

  <!-- File List Container -->
  <main class="flex-1 p-4 flex flex-col gap-2">
    <!-- Item 1: Folder -->
    <div class="flex items-center justify-between p-3 rounded-xl bg-surface-0 border border-white/5 hover:bg-surface-1 transition-colors">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-accent-blue/10 border border-accent-blue/30 flex items-center justify-center text-accent-blue">
          <span class="material-symbols-outlined">folder</span>
        </div>
        <div class="flex flex-col">
          <span class="font-semibold text-white text-sm">conf.d</span>
          <span class="font-mono text-xs text-white/40">drwxr-xr-x • 4 items</span>
        </div>
      </div>
      <span class="material-symbols-outlined text-white/30 text-sm">chevron_right</span>
    </div>

    <!-- Item 2: Log File -->
    <div class="flex items-center justify-between p-3 rounded-xl bg-surface-0 border border-white/5 hover:bg-surface-1 transition-colors">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-amber-400">
          <span class="material-symbols-outlined">description</span>
        </div>
        <div class="flex flex-col">
          <span class="font-semibold text-white text-sm">access.log</span>
          <span class="font-mono text-xs text-white/40">-rw-r--r-- • 14.2 MB • 2m ago</span>
        </div>
      </div>
      <button class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-white/50 hover:text-white">
        <span class="material-symbols-outlined text-sm">more_vert</span>
      </button>
    </div>

    <!-- Item 3: Log File -->
    <div class="flex items-center justify-between p-3 rounded-xl bg-surface-0 border border-white/5 hover:bg-surface-1 transition-colors">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-red-400">
          <span class="material-symbols-outlined">error</span>
        </div>
        <div class="flex flex-col">
          <span class="font-semibold text-white text-sm">error.log</span>
          <span class="font-mono text-xs text-white/40">-rw-r--r-- • 1.8 MB • 5m ago</span>
        </div>
      </div>
      <button class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-white/50 hover:text-white">
        <span class="material-symbols-outlined text-sm">more_vert</span>
      </button>
    </div>
  </main>

  <!-- Bottom Transfer Toast -->
  <footer class="p-4 bg-surface-1 border-t border-white/10 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-accent-blue animate-spin">sync</span>
      <div class="flex flex-col">
        <span class="text-xs font-semibold text-white">Downloading access.log...</span>
        <span class="font-mono text-[10px] text-white/50">4.2 MB / 14.2 MB (620 KB/s)</span>
      </div>
    </div>
    <div class="w-16 h-1.5 bg-surface-2 rounded-full overflow-hidden">
      <div class="h-full bg-accent-blue w-[30%]"></div>
    </div>
  </footer>

</body>
</html>
