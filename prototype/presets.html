<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Tether / OPA - Preset Library</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "oled-black": "#000000",
            "surface-0": "#1C1C1E",
            "surface-1": "#2C2C2E",
            "accent-blue": "#0A84FF"
          },
          fontFamily: {
            mono: ["JetBrains Mono", "monospace"],
            sans: ["Hanken Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #000000; color: #E0E2ED; font-family: 'Hanken Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-oled-black min-h-screen p-4 flex flex-col gap-4">
  
  <header class="flex items-center justify-between py-2">
    <div class="flex items-center gap-2">
      <button class="w-8 h-8 rounded-full bg-surface-1 flex items-center justify-center text-white/70">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
      </button>
      <h1 class="text-lg font-bold text-white">Developer Preset Catalog</h1>
    </div>
  </header>

  <!-- Category Tabs -->
  <div class="flex items-center gap-2 overflow-x-auto no-scrollbar font-mono text-xs">
    <button class="px-3 py-1.5 rounded-lg bg-accent-blue text-white font-bold">Docker</button>
    <button class="px-3 py-1.5 rounded-lg bg-surface-0 text-white/50 border border-white/5">Nginx</button>
    <button class="px-3 py-1.5 rounded-lg bg-surface-0 text-white/50 border border-white/5">Kubernetes</button>
    <button class="px-3 py-1.5 rounded-lg bg-surface-0 text-white/50 border border-white/5">System</button>
  </div>

  <main class="flex flex-col gap-3">
    <!-- Preset Card 1 -->
    <div class="p-4 rounded-xl bg-surface-0 border border-white/5 flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <span class="font-semibold text-white text-sm">List All Running Containers</span>
        <button class="px-2.5 py-1 rounded bg-accent-blue/20 text-accent-blue text-xs font-semibold flex items-center gap-1">
          <span class="material-symbols-outlined text-xs">add</span> Add
        </button>
      </div>
      <div class="font-mono text-xs text-white/60 bg-black/40 p-2.5 rounded-lg border border-white/5 overflow-x-auto">
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      </div>
    </div>
  </main>

</body>
</html>
